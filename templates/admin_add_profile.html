{% extends "base.html" %}
{% block title %}Add Profile{% endblock %}
{% block content %}

<h1 class="page-title">Add New Profile</h1>

<form method="POST" enctype="multipart/form-data" class="card" style="max-width:560px;">

    <label>Full Name *</label>
    <input type="text" name="name" required>

    <label>Age *</label>
    <input type="number" name="age" min="18" max="80" required>

    <label>Gender *</label>
    <select name="gender" required>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <label>City *</label>
    <input type="text" name="city" required>

    <label>Marital Status</label>
    <input type="text" name="marital_status" placeholder="e.g. Never Married">

    <label>Education</label>
    <input type="text" name="education" placeholder="e.g. B.Tech (CSE)">

    <label>Profession</label>
    <input type="text" name="profession" placeholder="e.g. Software Engineer">

    <label>Community</label>
    <input type="text" name="community" placeholder="e.g. Muslim – Ashraf">

    <label>Bio / About</label>
    <textarea name="bio" rows="4"></textarea>

    <label>Contact Number to share after unlock</label>
    <input type="text" name="contact_number" placeholder="Number interested users should call">

    <label>Photo</label>
    <input type="file" name="photo" accept="image/*">

    <div style="margin-top:20px;">
        <button class="btn btn-primary" type="submit">Save Profile</button>
        <a class="btn btn-outline" href="{{ url_for('admin_dashboard') }}">Cancel</a>
    </div>
</form>

{% endblock %}
