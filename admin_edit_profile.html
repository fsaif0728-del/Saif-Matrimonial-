{% extends "base.html" %}
{% block title %}Edit Profile {{ profile.profile_code }}{% endblock %}
{% block content %}

<section class="container-narrow">
    <h1 class="section-title">Edit Profile {{ profile.profile_code }}</h1>

    <form method="POST" enctype="multipart/form-data" class="card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        {% set f = form if form else profile %}

        <label>Full Name *</label>
        <input type="text" name="name" value="{{ f.name }}" required>

        <label>Age * (18–90)</label>
        <input type="number" name="age" min="18" max="90" value="{{ f.age }}" required>

        <label>Gender *</label>
        <select name="gender" required>
            <option value="Male" {{ 'selected' if f.gender=='Male' }}>Male</option>
            <option value="Female" {{ 'selected' if f.gender=='Female' }}>Female</option>
        </select>

        <label>City *</label>
        <input type="text" name="city" value="{{ f.city }}" required>

        <label>Marital Status</label>
        <input type="text" name="marital_status" value="{{ f.marital_status or '' }}">

        <label>Education</label>
        <input type="text" name="education" value="{{ f.education or '' }}">

        <label>Profession</label>
        <input type="text" name="profession" value="{{ f.profession or '' }}">

        <label>Community</label>
        <input type="text" name="community" value="{{ f.community or '' }}">

        <label>Bio / About</label>
        <textarea name="bio" rows="4">{{ f.bio or '' }}</textarea>

        <label>Contact Number</label>
        <input type="text" name="contact_number" value="{{ f.contact_number or '' }}">

        <label>Replace Photo (optional)</label>
        <input type="file" name="photo" accept="image/*">
        <div class="helptext">Leave empty to keep the current photo.</div>

        <div style="margin-top:22px; display:flex; gap:10px;">
            <button class="btn btn-primary" type="submit">Save Changes</button>
            <a class="btn btn-outline" href="{{ url_for('admin_profiles') }}">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
