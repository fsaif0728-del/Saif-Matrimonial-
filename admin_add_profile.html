{% extends "base.html" %}
{% block title %}Add Profile{% endblock %}
{% block content %}

<section class="container-narrow">
    <h1 class="section-title">Add New Profile</h1>

    <form method="POST" enctype="multipart/form-data" class="card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Full Name *</label>
        <input type="text" name="name" value="{{ form.name if form else '' }}" required>

        <label>Age * (18–90)</label>
        <input type="number" name="age" min="18" max="90" value="{{ form.age if form else '' }}" required>

        <label>Gender *</label>
        <select name="gender" required>
            <option value="Male" {{ 'selected' if form and form.gender=='Male' }}>Male</option>
            <option value="Female" {{ 'selected' if form and form.gender=='Female' }}>Female</option>
        </select>

        <label>City *</label>
        <input type="text" name="city" value="{{ form.city if form else '' }}" required>

        <label>Marital Status</label>
        <input type="text" name="marital_status" value="{{ form.marital_status if form else '' }}" placeholder="e.g. Never Married">

        <label>Education</label>
        <input type="text" name="education" value="{{ form.education if form else '' }}" placeholder="e.g. B.Tech (CSE)">

        <label>Profession</label>
        <input type="text" name="profession" value="{{ form.profession if form else '' }}" placeholder="e.g. Software Engineer">

        <label>Community</label>
        <input type="text" name="community" value="{{ form.community if form else '' }}" placeholder="e.g. Muslim – Ashraf">

        <label>Bio / About</label>
        <textarea name="bio" rows="4">{{ form.bio if form else '' }}</textarea>

        <label>Contact Number to share after unlock</label>
        <input type="text" name="contact_number" value="{{ form.contact_number if form else '' }}">

        <label>Photo</label>
        <input type="file" name="photo" accept="image/*">
        <div class="helptext">JPG, PNG or WEBP, up to 6 MB. A blurred preview is generated automatically; the original stays private.</div>

        <div style="margin-top:22px; display:flex; gap:10px;">
            <button class="btn btn-primary" type="submit">Save Profile</button>
            <a class="btn btn-outline" href="{{ url_for('admin_dashboard') }}">Cancel</a>
        </div>
    </form>
</section>

{% endblock %}
